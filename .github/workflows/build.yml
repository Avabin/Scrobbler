name: build

on:
  push:
    branches: [main]
    paths:
      - "Scrobbler/**"
      - "Scrobbler.Cli/**"
      - "Scrobbler.LastFm/**"
      - "global.json"
      - "Scrobbler.slnx"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
  pull_request:
    paths:
      - "Scrobbler/**"
      - "Scrobbler.Cli/**"
      - "Scrobbler.LastFm/**"
      - "global.json"
      - "Scrobbler.slnx"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avabin/scrobbler-build:latest
      options: --user root
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Scrobbler.slnx

      - name: Build
        run: dotnet build Scrobbler.slnx -c Release --no-restore

      # Future test step placeholder:
      # - name: Test
      #   run: dotnet test Scrobbler.slnx -c Release --no-build
