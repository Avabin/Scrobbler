name: package

on:
  push:
    branches: [main]
    paths:
      - "Scrobbler/**"
      - "Scrobbler.Cli/**"
      - "Scrobbler.LastFm/**"
      - "Formula/**"
      - "global.json"
      - "Scrobbler.slnx"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: homebrew/actions/setup-homebrew@master

      - name: Setup .NET (cached)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true

      - name: Build and package via Homebrew (from source)
        run: |
          brew install --build-from-source ./Formula/scrobbler.rb
          brew bottle --json --root-url "https://github.com/Avabin/Scrobbler/releases" scrobbler \
            | tee bottle-output.json

      - name: Upload bottle artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrobbler-bottle
          path: |
            scrobbler--*.bottle.tar.gz
            scrobbler--*.bottle.json
            bottle-output.json
          if-no-files-found: error
