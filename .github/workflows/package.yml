name: package

on:
  push:
    branches: [main]
    paths:
      - "Scrobbler/**"
      - "Scrobbler.Cli/**"
      - "Scrobbler.LastFm/**"
      - "Formula/**"
      - "global.json"
      - "Scrobbler.slnx"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avabin/scrobbler-build:latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Brew package
        id: brew
        uses: ./.github/actions/brew-package

      - name: Upload bottle artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrobbler-bottle
          path: |
            scrobbler--*.bottle.tar.gz
            scrobbler--*.bottle.json
          if-no-files-found: error
