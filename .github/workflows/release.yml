name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub release"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avabin/scrobbler-build:latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Drop version and revision into formula
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION="${{ github.event.inputs.version }}"
          REVISION="$(git rev-list -n 1 "$VERSION")"
          sed -i "s/tag: \"v[^\"]*\"/tag: \"$VERSION\"/" Formula/scrobbler.rb
          sed -i "s/revision: \"[0-9a-f]*\"/revision: \"$REVISION\"/" Formula/scrobbler.rb

      - name: Build and package via Homebrew (from source)
        run: |
          # checkout/sed ran as root; the script re-execs itself as linuxbrew.
          chown -R linuxbrew:linuxbrew "$GITHUB_WORKSPACE"
          bash scripts/package.sh

      - name: Upload bottle artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrobbler-bottle
          path: |
            scrobbler--*.bottle.tar.gz
            scrobbler--*.bottle.json
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          draft: true
          files: scrobbler--*.bottle.tar.gz
