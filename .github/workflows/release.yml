name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub release"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: homebrew/actions/setup-homebrew@master

      - name: Setup .NET (cached)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Drop version into formula
        run: |
          sed -i "s/tag: \"v[^\"]*\"/tag: \"${{ github.event.inputs.version }}\"/" Formula/scrobbler.rb

      - name: Build and package via Homebrew (from source)
        run: |
          brew install --build-from-source ./Formula/scrobbler.rb
          brew bottle --json --root-url "https://github.com/Avabin/Scrobbler/releases" scrobbler \
            | tee bottle-output.json

      - name: Upload bottle artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrobbler-bottle
          path: |
            scrobbler--*.bottle.tar.gz
            scrobbler--*.bottle.json
            bottle-output.json
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          draft: true
          files: scrobbler--*.bottle.tar.gz
