name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0)"
        required: true
        type: string
      publish:
        description: "Publish a GitHub release"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/avabin/scrobbler-build:latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Drop version into formula
        run: |
          sed -i "s/tag: \"v[^\"]*\"/tag: \"${{ github.event.inputs.version }}\"/" Formula/scrobbler.rb

      - name: Build and package via Homebrew (from source)
        run: |
          # brew must run as its own (non-root) user; the image provides
          # passwordless sudo for linuxbrew.
          sudo -u linuxbrew bash <<'EOF'
          set -e
          git config --global user.email "andrzej.piotrowski76@gmail.com"
          git config --global user.name "Avabin"
          brew tap-new local/scrobbler
          TAP_FORMULA="$(brew --repository)/Library/Taps/local/homebrew-scrobbler/Formula"
          mkdir -p "$TAP_FORMULA"
          cp Formula/scrobbler.rb "$TAP_FORMULA/scrobbler.rb"
          brew install --build-from-source local/scrobbler/scrobbler
          brew bottle --json --root-url "https://github.com/Avabin/Scrobbler/releases" local/scrobbler/scrobbler \
            | tee bottle-output.json
          EOF
          find . -name '*.bottle.tar.gz' -o -name '*.bottle.json' | head

      - name: Upload bottle artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrobbler-bottle
          path: |
            scrobbler--*.bottle.tar.gz
            scrobbler--*.bottle.json
            bottle-output.json
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          draft: true
          files: scrobbler--*.bottle.tar.gz
